<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الحروف الهجائية</title>
    <!-- خطوط عربية -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=Noto+Naskh+Arabic:wght@700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            /* خلفية إسلامية هادئة جداً (نمط النجمة الثمانية) */
            background-color: #f8fafc;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cpath d='M30 0l10 10h10v10L60 30l-10 10v10H40L30 60 20 50H10V40L0 30l10-10V10h10L30 0zm0 14.14L18.14 26H14v4.14L2.14 42l11.86 11.86V58h4.14L30 45.86 41.86 58h4.14v-4.14L57.86 42 46 30.14V26h-4.14L30 14.14z' fill='%2364748b' fill-opacity='0.08'/%3E%3C/g%3E%3C/svg%3E");
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* خط النسخ التعليمي المخصص للحروف */
        .arabic-letter {
            font-family: 'Noto Naskh Arabic', serif;
        }

        /* تأثير الزجاج اللطيف للصناديق */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        /* الاهتزاز عند الخطأ */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-6px) rotate(-2deg); }
            20%, 40%, 60%, 80% { transform: translateX(6px) rotate(2deg); }
        }
        .shake-animation {
            animation: shake 0.4s both;
            background: linear-gradient(to bottom, #ef4444, #dc2626) !important;
            color: white !important;
            border-color: #991b1b !important;
            box-shadow: 0 4px 0px #7f1d1d !important;
        }

        /* حركة الظهور عند النجاح */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* تصميم الأزرار الأساسي - تأثير 3D ناعم منتفخ */
        .btn-base {
            transition: all 0.15s ease;
        }
        .btn-base:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px transparent !important;
            filter: brightness(0.9);
        }
        .btn-base:hover {
            filter: brightness(1.05);
        }

        /* ألوان المجموعات بتدرجات جذابة وتأثير 3D */
        .color-group-1 {
            background: linear-gradient(to bottom, #eff6ff, #bae6fd);
            color: #1e40af; 
            border: 2px solid #7dd3fc; 
            box-shadow: 0 5px 0px #38bdf8;
        }
        .color-group-2 {
            background: linear-gradient(to bottom, #f0fdf4, #bbf7d0);
            color: #166534; 
            border: 2px solid #86efac; 
            box-shadow: 0 5px 0px #4ade80;
        }
        .color-group-3 {
            background: linear-gradient(to bottom, #faf5ff, #e9d5ff);
            color: #6b21a8; 
            border: 2px solid #d8b4fe; 
            box-shadow: 0 5px 0px #c084fc;
        }

        /* نبض الصندوق المطلوب */
        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 6px rgba(59, 130, 246, 0); }
        }
        .target-pulse {
            animation: gentlePulse 2s infinite;
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
        }

        /* تدرج لوني للنص */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to left, #6366f1, #d946ef, #f43f5e);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-2 sm:p-4">

    <!-- نافذة كلمة السر (مخفية افتراضياً) -->
    <div id="password-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/70 backdrop-blur-sm px-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl pop-in border-4 border-fuchsia-200">
            <div class="text-5xl mb-3">🔒</div>
            <h3 class="text-xl font-bold text-gray-800 mb-4">أدخلي كلمة السر للعب أشكال الحروف</h3>
            <input type="password" id="password-input" inputmode="numeric" class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 text-center text-3xl tracking-widest mb-2 focus:border-fuchsia-500 focus:ring-2 focus:ring-fuchsia-200 outline-none" placeholder="•••" dir="ltr">
            <p id="password-error" class="text-red-500 text-sm font-bold hidden mb-4">كلمة السر خاطئة! حاولي مرة أخرى.</p>
            <div class="flex gap-3 mt-4">
                <button onclick="checkPassword()" class="flex-1 bg-fuchsia-500 hover:bg-fuchsia-600 text-white font-bold py-3 rounded-xl shadow-md transition-colors">تأكيد</button>
                <button onclick="cancelPassword()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-xl transition-colors">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- شاشة الاحتفال عند الانتهاء مع الدرجة -->
    <div id="celebration" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md px-4">
        <div class="relative bg-white/90 backdrop-blur-xl rounded-[2rem] p-8 text-center shadow-2xl border-4 border-white w-full max-w-sm pop-in">
            
            <!-- زر الإغلاق X (تم إصلاحه برفع z-index) -->
            <button type="button" onclick="closeCelebration()" class="absolute top-4 left-4 z-20 w-10 h-10 flex items-center justify-center rounded-full bg-gray-200 hover:bg-red-100 text-gray-600 hover:text-red-500 transition-colors shadow-sm focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <div class="text-8xl mb-4 drop-shadow-lg mt-2">🎉</div>
            <h1 class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-500 to-emerald-700 mb-2">
                يا لكِ من بطلة يا <span id="student-name-display"></span>!
            </h1>
            <p class="text-xl text-gray-700 font-bold mb-5">أكملتِ المطلوب بامتياز 🌟</p>
            
            <div class="flex gap-3 justify-center mb-6">
                <div class="bg-red-50 text-red-600 font-bold p-3 rounded-2xl border-2 border-red-200 flex-1 shadow-inner">
                    <div class="text-sm mb-1">عدد الأخطاء</div>
                    <div id="final-mistakes" class="text-3xl">0</div>
                </div>
                <div class="bg-blue-50 text-blue-700 font-bold p-3 rounded-2xl border-2 border-blue-200 flex-1 shadow-inner">
                    <div class="text-sm mb-1">الدرجة النهائية</div>
                    <div id="final-score" class="text-3xl" dir="ltr">100%</div>
                </div>
            </div>

            <button onclick="restartGame()" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-black text-2xl py-4 rounded-2xl shadow-[0_6px_0_#3730a3] hover:shadow-[0_4px_0_#3730a3] hover:translate-y-[2px] active:translate-y-[6px] active:shadow-none transition-all">
                هيا نلعب مجدداً 🔄
            </button>
        </div>
    </div>

    <!-- شريط العنوان والقوائم المنسدلة -->
    <div class="w-full max-w-md flex flex-col items-center mb-3 mt-2 px-1 gap-3">
        <h1 class="text-2xl sm:text-3xl font-black text-gradient drop-shadow-md tracking-wide w-full text-center">الحروف الهجائية</h1>
        
        <div class="flex flex-row w-full gap-2">
            <!-- قائمة الطالبات -->
            <select id="student-name" dir="rtl" class="flex-1 bg-white/80 backdrop-blur-sm border-2 border-indigo-300 text-indigo-800 font-bold py-2 px-2 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 text-sm outline-none cursor-pointer">
                <!-- الأسماء المحدثة -->
                <option value="سمية">الطالبة: سمية</option>
                <option value="منة">الطالبة: منة</option>
            </select>
            
            <!-- قائمة اللعبة -->
            <select id="game-mode" onchange="handleModeChange()" dir="rtl" class="flex-1 bg-white/80 backdrop-blur-sm border-2 border-fuchsia-300 text-fuchsia-800 font-bold py-2 px-2 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-fuchsia-200 text-sm outline-none cursor-pointer">
                <option value="alphabet">الحروف الهجائية</option>
                <option value="all_forms">أشكال الحروف 🔒</option>
            </select>
        </div>
    </div>

    <!-- لوحة المعلم (عداد الأخطاء والتقدم) -->
    <div class="w-full max-w-md flex justify-between items-center glass-panel p-3 rounded-2xl mb-4">
        <div class="flex items-center gap-2">
            <div class="bg-red-100/80 text-red-700 px-4 py-2 rounded-xl text-sm font-black flex items-center gap-2 border border-red-200 shadow-sm">
                <span>❌ أخطاء:</span>
                <span id="mistake-counter" class="text-xl">0</span>
            </div>
        </div>
        <div class="text-sm font-black text-blue-700 bg-blue-100/80 px-4 py-2 rounded-xl border border-blue-200 shadow-sm">
            التقدم: <span id="progress-text" class="text-lg">0/0</span>
        </div>
    </div>

    <!-- الجزء العلوي: خانات الحروف الفارغة (الصناديق) -->
    <div class="w-full max-w-md glass-panel p-4 rounded-3xl mb-5">
        <h2 id="target-title" class="text-sm sm:text-base font-bold text-gray-600 mb-3 text-center bg-gray-100/50 py-1 rounded-lg">الحروف الهجائية</h2>
        <div id="target-grid" class="flex flex-wrap justify-center gap-2 max-h-[25vh] overflow-y-auto p-2 relative rounded-xl" dir="rtl">
            <!-- الخانات ستتولد هنا -->
        </div>
    </div>

    <!-- التوجيه -->
    <div class="w-full max-w-md bg-gradient-to-r from-fuchsia-500 to-purple-600 text-white text-center py-3 rounded-2xl mb-4 shadow-lg border-2 border-white/50 relative overflow-hidden">
        <div class="absolute inset-0 bg-white/20 blur-md transform -skew-x-12 translate-x-full hover:translate-x-[-200%] transition-transform duration-1000"></div>
        <h2 class="text-lg font-black relative z-10 flex items-center justify-center gap-2">
            <span>✨</span> ابحثي عن الحرف المطلوب واضغطي عليه <span>✨</span>
        </h2>
    </div>

    <!-- الجزء السفلي: شبكة الحروف للضغط -->
    <div id="letters-grid" class="w-full max-w-md flex flex-wrap justify-center gap-2.5 sm:gap-3.5 pb-10 pt-2" dir="ltr">
        <!-- الأزرار ستتولد هنا -->
    </div>

    <script>
        const correctAlphabet = [
            'أ', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 
            'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'
        ];

        const letterFormsData = {
            'أ': ['أ', 'ـأ', 'ـأ'], 'ب': ['بـ', 'ـبـ', 'ـب'], 'ت': ['تـ', 'ـتـ', 'ـت'], 'ث': ['ثـ', 'ـثـ', 'ـث'],
            'ج': ['جـ', 'ـجـ', 'ـج'], 'ح': ['حـ', 'ـحـ', 'ـح'], 'خ': ['خـ', 'ـخـ', 'ـخ'], 'د': ['د', 'ـد', 'ـد'],
            'ذ': ['ذ', 'ـذ', 'ـذ'], 'ر': ['ر', 'ـر', 'ـر'], 'ز': ['ز', 'ـز', 'ـز'], 'س': ['سـ', 'ـسـ', 'ـس'],
            'ش': ['شـ', 'ـشـ', 'ـش'], 'ص': ['صـ', 'ـصـ', 'ـص'], 'ض': ['ضـ', 'ـضـ', 'ـض'], 'ط': ['طـ', 'ـطـ', 'ـط'],
            'ظ': ['ظـ', 'ـظـ', 'ـظ'], 'ع': ['عـ', 'ـعـ', 'ـع'], 'غ': ['غـ', 'ـغـ', 'ـغ'], 'ف': ['فـ', 'ـفـ', 'ـف'],
            'ق': ['قـ', 'ـقـ', 'ـق'], 'ك': ['كـ', 'ـكـ', 'ـك'], 'ل': ['لـ', 'ـلـ', 'ـل'], 'م': ['مـ', 'ـمـ', 'ـم'],
            'ن': ['نـ', 'ـنـ', 'ـن'], 'هـ': ['هـ', 'ـهـ', 'ـه'], 'و': ['و', 'ـو', 'ـو'], 'ي': ['يـ', 'ـيـ', 'ـي']
        };

        const group1Letters = ['أ', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز'];
        const group2Letters = ['س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق'];
        const group3Letters = ['ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'];

        function getLetterColorClass(letterForm) {
            if (group1Letters.includes(letterForm)) return 'color-group-1';
            if (group2Letters.includes(letterForm)) return 'color-group-2';
            if (group3Letters.includes(letterForm)) return 'color-group-3';
            for (let base of group1Letters) if (letterFormsData[base] && letterFormsData[base].includes(letterForm)) return 'color-group-1';
            for (let base of group2Letters) if (letterFormsData[base] && letterFormsData[base].includes(letterForm)) return 'color-group-2';
            for (let base of group3Letters) if (letterFormsData[base] && letterFormsData[base].includes(letterForm)) return 'color-group-3';
            return 'color-group-1';
        }

        let allFormsSequence = [];
        correctAlphabet.forEach(letter => allFormsSequence.push(...letterFormsData[letter]));

        let currentSequence = []; 
        let currentIndex = 0;
        let mistakes = 0;
        let isFormsModeUnlocked = false; // متغير لتتبع حالة فتح اللعبة المحمية بكلمة سر

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6);
            }
        }

        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        window.onload = () => initGame();

        // نظام التحقق من كلمة السر
        function handleModeChange() {
            const mode = document.getElementById('game-mode').value;
            
            if (mode === 'all_forms' && !isFormsModeUnlocked) {
                // إرجاع القائمة للحروف الهجائية مؤقتاً حتى إدخال الرمز
                document.getElementById('game-mode').value = 'alphabet';
                // إظهار نافذة كلمة السر
                document.getElementById('password-modal').classList.remove('hidden');
                document.getElementById('password-input').value = '';
                document.getElementById('password-error').classList.add('hidden');
                setTimeout(() => document.getElementById('password-input').focus(), 100);
            } else {
                changeGameMode();
            }
        }

        function checkPassword() {
            const pwd = document.getElementById('password-input').value;
            if (pwd === '111') {
                isFormsModeUnlocked = true; // تم فك القفل
                document.getElementById('password-modal').classList.add('hidden');
                document.getElementById('game-mode').value = 'all_forms';
                changeGameMode();
            } else {
                document.getElementById('password-error').classList.remove('hidden');
            }
        }

        function cancelPassword() {
            document.getElementById('password-modal').classList.add('hidden');
            document.getElementById('game-mode').value = 'alphabet';
        }

        function changeGameMode() {
            mistakes = 0;
            document.getElementById('mistake-counter').innerText = '0';
            document.getElementById('celebration').classList.add('hidden');
            initGame();
        }

        function restartGame() {
            mistakes = 0;
            document.getElementById('mistake-counter').innerText = '0';
            document.getElementById('celebration').classList.add('hidden');
            initGame();
        }
        
        // دالة لإغلاق نافذة النتيجة دون إعادة اللعب لرؤية الإنجاز
        function closeCelebration() {
            document.getElementById('celebration').classList.add('hidden');
        }

        function initGame() {
            const mode = document.getElementById('game-mode').value;
            const targetTitle = document.getElementById('target-title');
            
            if (mode === 'alphabet') {
                currentSequence = [...correctAlphabet];
                targetTitle.innerText = "الحروف الهجائية";
            } else {
                currentSequence = [...allFormsSequence];
                targetTitle.innerText = "أشكال الحروف";
            }

            currentIndex = 0;
            document.getElementById('progress-text').innerText = `0/${currentSequence.length}`;

            const targetGrid = document.getElementById('target-grid');
            const lettersGrid = document.getElementById('letters-grid');
            
            targetGrid.innerHTML = '';
            lettersGrid.innerHTML = '';

            const isAlphabetMode = (mode === 'alphabet');
            const slotSizeClass = isAlphabetMode ? 'w-10 h-10 sm:w-12 sm:h-12 text-xl' : 'w-8 h-8 sm:w-10 sm:h-10 text-base sm:text-lg';
            const btnSizeClass = isAlphabetMode ? 'w-14 h-14 sm:w-16 sm:h-16 text-2xl' : 'w-12 h-12 sm:w-14 sm:h-14 text-xl sm:text-2xl';

            if (isAlphabetMode) {
                currentSequence.forEach((letter, index) => {
                    const slot = document.createElement('div');
                    slot.className = `arabic-letter ${slotSizeClass} flex items-center justify-center font-bold rounded-2xl border-2 border-dashed border-gray-400 bg-white/50 text-gray-400 shadow-inner transition-all duration-300`;
                    slot.id = `slot-${index}`;
                    slot.innerText = '?';
                    targetGrid.appendChild(slot);
                });
            } else {
                for (let i = 0; i < currentSequence.length; i += 3) {
                    const group = document.createElement('div');
                    group.className = 'flex gap-1.5 p-1.5 bg-white/60 backdrop-blur-sm rounded-[1rem] border-2 border-white shadow-sm';
                    for (let j = 0; j < 3; j++) {
                        const index = i + j;
                        if (index < currentSequence.length) {
                            const slot = document.createElement('div');
                            slot.className = `arabic-letter ${slotSizeClass} flex items-center justify-center font-bold rounded-xl border-2 border-dashed border-gray-400 bg-white/50 text-gray-400 shadow-inner transition-all duration-300`;
                            slot.id = `slot-${index}`;
                            slot.innerText = '?';
                            group.appendChild(slot);
                        }
                    }
                    targetGrid.appendChild(group);
                }
            }

            let itemsToRender = [];
            if (isAlphabetMode) {
                itemsToRender = [...shuffleArray([...group1Letters]), ...shuffleArray([...group2Letters]), ...shuffleArray([...group3Letters])];
            } else {
                let g1 = [], g2 = [], g3 = [];
                group1Letters.forEach(l => g1.push(...letterFormsData[l]));
                group2Letters.forEach(l => g2.push(...letterFormsData[l]));
                group3Letters.forEach(l => g3.push(...letterFormsData[l]));
                itemsToRender = [...shuffleArray(g1), ...shuffleArray(g2), ...shuffleArray(g3)];
            }

            itemsToRender.forEach((letter) => {
                const btn = document.createElement('button');
                const colorClass = getLetterColorClass(letter);
                btn.className = `arabic-letter btn-base ${colorClass} ${btnSizeClass} font-black rounded-2xl flex items-center justify-center cursor-pointer`;
                btn.innerText = letter;
                
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    handleLetterClick(letter, btn);
                }, {passive: false});
                btn.addEventListener('click', () => handleLetterClick(letter, btn));

                lettersGrid.appendChild(btn);
            });

            highlightNextExpected();
        }

        function highlightNextExpected() {
            document.querySelectorAll('.target-pulse').forEach(el => {
                el.classList.remove('target-pulse');
                el.classList.add('border-gray-400', 'bg-white/50');
            });
            
            if(currentIndex < currentSequence.length) {
                const currentSlot = document.getElementById(`slot-${currentIndex}`);
                if (currentSlot) {
                    currentSlot.classList.remove('border-gray-400', 'bg-white/50');
                    currentSlot.classList.add('target-pulse');

                    const container = document.getElementById('target-grid');
                    if (container) {
                        const scrollPos = currentSlot.offsetTop - container.offsetTop - (container.clientHeight / 2) + (currentSlot.clientHeight / 2);
                        container.scrollTo({ top: scrollPos, behavior: 'smooth' });
                    }
                }
            }
        }

        function handleLetterClick(letter, btnElement) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const expectedLetter = currentSequence[currentIndex];

            if (letter === expectedLetter) {
                playSound('correct');
                
                const isAlphabetMode = (document.getElementById('game-mode').value === 'alphabet');
                const slotSizeClass = isAlphabetMode ? 'w-10 h-10 sm:w-12 sm:h-12 text-xl' : 'w-8 h-8 sm:w-10 sm:h-10 text-base sm:text-lg';

                const targetSlot = document.getElementById(`slot-${currentIndex}`);
                targetSlot.innerText = letter;
                
                // تلوين الخانة الصحيحة بتدرج أخضر جميل
                targetSlot.className = `arabic-letter pop-in ${slotSizeClass} flex items-center justify-center font-black rounded-2xl bg-gradient-to-br from-green-400 to-emerald-600 text-white shadow-md border-2 border-green-200`;

                btnElement.style.transform = 'scale(0) rotate(15deg)';
                btnElement.style.opacity = '0';
                setTimeout(() => btnElement.remove(), 200);

                currentIndex++;
                document.getElementById('progress-text').innerText = `${currentIndex}/${currentSequence.length}`;
                
                highlightNextExpected();

                if (currentIndex === currentSequence.length) {
                    setTimeout(() => {
                        playSound('win');
                        
                        // استخراج اسم الطالبة من القائمة
                        const selectedStudentElement = document.getElementById('student-name');
                        const studentName = selectedStudentElement.options[selectedStudentElement.selectedIndex].value;
                        document.getElementById('student-name-display').innerText = studentName;

                        // حساب الدرجة النهائية
                        const totalAttempts = currentSequence.length + mistakes;
                        const scorePercentage = (currentSequence.length / totalAttempts) * 100;
                        const formattedScore = scorePercentage % 1 === 0 ? scorePercentage.toString() : scorePercentage.toFixed(1);
                        
                        document.getElementById('final-mistakes').innerText = mistakes;
                        document.getElementById('final-score').innerText = formattedScore + '%';
                        document.getElementById('celebration').classList.remove('hidden');
                    }, 400);
                }
            } else {
                playSound('wrong');
                mistakes++;
                document.getElementById('mistake-counter').innerText = mistakes;
                
                btnElement.classList.add('shake-animation');
                setTimeout(() => btnElement.classList.remove('shake-animation'), 400);
            }
        }
    </script>
</body>
</html>
